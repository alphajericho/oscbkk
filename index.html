<!-- Site-side funnel tracking. The checkout runs off-site, so our
     pixel cannot see events inside it. This fires InitiateCheckout on our own
     pixel whenever a visitor opens the checkout from any CTA on this page, and
     a ViewContent when the tickets section is first scrolled into view. Optimise
     campaigns toward InitiateCheckout — it is the last event we own reliably. -->
<script>
(function(){
  if (typeof fbq !== 'function') return;
  var fired = {};
  function label(a){
    var card = a.closest('.ticket, .pkg');
    var name = card && card.querySelector('.ticket__name, .pkg__name');
    return (name ? name.textContent : a.textContent).trim().replace(/\s*↗$/,'');
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href*="tickets.alpha11.co"]');
    if (!a) return;
    fbq('track', 'InitiateCheckout', {
      content_name: label(a),
      content_category: a.closest('.pkg') ? 'Lounge Package' : 'Ticket',
      currency: 'THB'
    });
  }, true);
  var tickets = null;
  function watch(){
    tickets = document.getElementById('tickets');
    if (!tickets) return setTimeout(watch, 400);
    new IntersectionObserver(function(entries, obs){
      if (entries[0].isIntersecting && !fired.vc) {
        fired.vc = true;
        fbq('track', 'ViewContent', { content_name: 'Tickets', content_category: 'Ticket', currency: 'THB' });
        obs.disconnect();
      }
    }, { threshold: 0.4 }).observe(tickets);
  }
  watch();
})();
</script>
